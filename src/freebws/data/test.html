<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>FreeBWS test page</title>
<style>
body { font-family: "IBM Plex Sans", sans-serif; margin: 0; padding: 1.2rem 1.6rem; background: #f4f6f8; color: #1d2125; }
h1 { margin: 0 0 .4rem; font-size: 1.8rem; }
.row { display: flex; gap: .8rem; flex-wrap: wrap; margin: 1rem 0; }
.box { width: 8rem; height: 5rem; border-radius: .5rem; color: #fff; display: grid; place-items: center; font-weight: 600; }
code { font-family: "IBM Plex Mono", monospace; background: #e3e7eb; padding: .1rem .35rem; border-radius: .25rem; }
canvas { border: 1px solid #b8c0c8; border-radius: .4rem; background: #fff; }
#clock { font-family: "IBM Plex Mono", monospace; font-size: 1.3rem; }
a { color: #1f6f43; }
.tall { height: 1400px; background: linear-gradient(#f4f6f8, #cfd8e0); border-radius: .5rem; padding: .6rem; }
</style></head>
<body>
<h1>FreeBWS test page</h1>
<p>WPE WebKit in a libflui window. Sans <b>bold</b> <i>italic</i> and <code>monospace</code>; unicode: äöü ß € → ✓ 日本語.</p>
<div class="row">
<div class="box" style="background:#3f9b63">green</div>
<div class="box" style="background:#2f6fb5">blue</div>
<div class="box" style="background:#c0452f">red</div>
<div class="box" style="background:linear-gradient(135deg,#e0a030,#c0452f)">gradient</div>
</div>
<p id="js">JavaScript: waiting</p>
<p>Clock: <span id="clock">--:--:--</span> &nbsp; Ticks: <span id="frames">0</span></p>
<canvas id="cv" width="420" height="120"></canvas>
<p><a href="#tall">Link to the bottom</a> &middot; <a href="tabs-test.html">tabs test</a></p>
<div class="tall" id="tall">Scroll area (1400 px tall).</div>
<script>
document.getElementById('js').textContent = 'JavaScript: running (' + navigator.userAgent.split(' ').slice(-2).join(' ') + ')';
var n = 0;
function tick() {
  document.getElementById('clock').textContent = new Date().toTimeString().slice(0, 8);
  document.getElementById('frames').textContent = ++n;
  var c = document.getElementById('cv').getContext('2d');
  c.clearRect(0, 0, 420, 120);
  c.fillStyle = '#3f9b63'; c.fillRect(10 + (n * 6) % 380, 20, 30, 30);
  c.fillStyle = '#2f6fb5'; c.beginPath(); c.arc(60 + (n * 4) % 300, 80, 16, 0, 6.3); c.fill();
  c.fillStyle = '#1d2125'; c.font = '14px sans-serif'; c.fillText('canvas 2d, tick ' + n, 10, 112);
  setTimeout(tick, 250);
}
tick();
</script>
</body></html>
