# /etc/nix/nix.conf -- FreeLFS defaults for a multi-user Nix on a 1 GB machine.
# Build jobs and cores are small: a 1 GB machine must not run a big build for the user.
experimental-features = nix-command flakes
build-users-group = nixbld
sandbox = true
max-jobs = 2
cores = 2
allowed-users = *
trusted-users = root
ssl-cert-file = /etc/ssl/certs/ca-certificates.crt
substituters = https://cache.nixos.org
