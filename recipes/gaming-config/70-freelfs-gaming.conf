# FreeLFS gaming: kernel settings for Proton games (rc.sysinit runs sysctl --system).
# SPDX-License-Identifier: MIT

# Many Windows games (and Wine's own allocator) map far more memory areas than the
# kernel default of 65530 allows; they crash at start with "out of memory" while
# memory is free. This is also the default in Fedora, Arch and SteamOS.
vm.max_map_count = 1048576
