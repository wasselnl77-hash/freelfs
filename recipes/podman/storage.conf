# FreeLFS: rootless containers keep images and containers in ~/.local/share/containers/storage
# (podman picks that itself for a normal user). The kernel's overlayfs works without root, so no
# fuse-overlayfs is needed. On a live system without persistence that directory is in RAM.
[storage]
driver = "overlay"

[storage.options.overlay]
# no mount_program: native overlay (kernel 5.13 or newer, userxattr)
