# FreeLFS: nothing runs at boot (podman has no daemon). Defaults except for the following.
[engine]
runtime = "crun"
# no systemd on FreeLFS: logs go to files, cgroups are managed by crun directly
cgroup_manager = "cgroupfs"
events_logger = "file"
helper_binaries_dir = ["/usr/libexec/podman", "/usr/bin"]

[containers]
# no systemd, so nobody hands a person a delegated cgroup: containers run without their own cgroup.
# (Distrobox then needs a private PID namespace: flpkg creates boxes with --unshare-process.)
cgroups = "disabled"
# fewer processes and no log spam for the small machines FreeLFS targets
log_driver = "k8s-file"
