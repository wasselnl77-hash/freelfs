<!-- Who may talk to bluetoothd on the system bus: every desktop user is in group seat, so
     Settings (bluetoothctl) and PipeWire's bluez5 plugin work without a password. The stock
     bluetooth.conf only knows root, group lp and at_console (there is no logind here).
     bluez calls back into the sender's own D-Bus object (agents, A2DP endpoints, profiles). -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy group="seat">
    <allow send_destination="org.bluez"/>
  </policy>
  <policy context="default">
    <allow send_interface="org.bluez.Agent1"/>
    <allow send_interface="org.bluez.MediaEndpoint1"/>
    <allow send_interface="org.bluez.MediaPlayer1"/>
    <allow send_interface="org.bluez.Profile1"/>
    <allow send_interface="org.bluez.ProfileManager1"/>
    <allow send_interface="org.bluez.ThermometerWatcher1"/>
    <allow send_interface="org.bluez.NetworkServer1"/>
  </policy>
</busconfig>
