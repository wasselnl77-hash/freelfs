<!-- Who may talk to iwd on the system bus, besides root and wheel (iwd-dbus.conf):
     every desktop user is in group seat, so Settings works without a password.
     netdev is declared in base-files, for the netdev line in iwd-dbus.conf. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy group="seat">
    <allow send_destination="net.connman.iwd"/>
  </policy>
</busconfig>
