# /etc/iwd/main.conf -- iwd settings (FreeLFS)

[General]
# iwd's own DHCP client gets the address of a Wi-Fi interface. dhcpcd (the
# "network" service) leaves wl* interfaces alone, see /etc/dhcpcd.conf.
EnableNetworkConfiguration=true

[Network]
# There is no systemd-resolved: iwd runs "resolvconf -a IFACE.dns" and
# "resolvconf -a IFACE.domain". FreeLFS has no resolvconf package; iwd's service
# puts /usr/lib/iwd/bin first in PATH, where a small script turns those calls
# into /etc/resolv.conf.
NameResolvingService=resolvconf
