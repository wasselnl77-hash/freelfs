#!/usr/sbin/nft -f
# /etc/nftables.conf -- the FreeLFS default firewall, applied at boot by the rc service "firewall"
# (/etc/rc.d/init.d/firewall; `nft -f /etc/nftables.conf` applies it by hand, `nft list ruleset` shows it).
#
# Inbound: everything unsolicited is dropped. Allowed: replies to what this computer started (established,
# related), loopback, the ICMP and ICMPv6 messages IP needs (errors, ping, neighbour discovery), DHCP and DHCPv6
# replies, and mDNS (UDP 5353) only while avahi runs: flcupsd fills the chain "mdns" when it starts avahi and
# empties it when avahi ends (/usr/libexec/fl-firewall-mdns). Outbound is not filtered; nothing is forwarded.
# Wi-Fi, Flatpak, the browser and downloads are all outbound connections: they work as before.
# To open a port for a service you run yourself, add a line to the chain "input", for example
#   tcp dport 8080 accept
# and run `nft -f /etc/nftables.conf`. FIREWALL=0 in /etc/rc.conf (or "!firewall" in SERVICES) turns it off.

flush ruleset

table inet filter {
	chain mdns {
	}

	chain input {
		type filter hook input priority 0; policy drop;

		ct state invalid drop
		ct state established,related accept
		iif "lo" accept

		ip protocol icmp icmp type { destination-unreachable, time-exceeded, parameter-problem, echo-request } accept
		meta l4proto ipv6-icmp icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, echo-request, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept

		udp sport 67 udp dport 68 accept
		ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept

		udp dport 5353 jump mdns
	}

	chain forward {
		type filter hook forward priority 0; policy drop;
	}

	chain output {
		type filter hook output priority 0; policy accept;
	}
}
