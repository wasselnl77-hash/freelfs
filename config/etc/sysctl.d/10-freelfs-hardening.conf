# /etc/sysctl.d/10-freelfs-hardening.conf -- kernel hardening that costs nothing visible (docs/SECURITY.md).
# Applied at boot by rc.sysinit (sysctl --system). To undo one line, copy it to a later file in /etc/sysctl.d
# (for example 90-local.conf) with the value you want.
# User namespaces stay ON: Flatpak and bubblewrap need them (user.max_user_namespaces is not touched).

# Kernel addresses and the kernel log are for root only (dmesg as a user fails; /var/log/dmesg.log is root's too).
kernel.kptr_restrict = 1
kernel.dmesg_restrict = 1

# No BPF programs for ordinary users (root and Flatpak/bwrap sandboxes do not need them).
kernel.unprivileged_bpf_disabled = 1
# (a leading "-" ignores a key this kernel does not have: no BPF JIT here, IPv6 may be off)
-net.core.bpf_jit_harden = 2

# A process may trace only its own children (needs CONFIG_SECURITY_YAMA; gdb on a new program still works,
# attaching to a running one needs root).
kernel.yama.ptrace_scope = 1

# Links and files in sticky directories (/tmp) cannot be abused by other users.
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# No core dumps from setuid programs.
fs.suid_dumpable = 0

# No new kernel from a running system, and no io_uring (large attack surface, nothing here uses it; set 0 to
# turn it back on).
kernel.kexec_load_disabled = 1
kernel.io_uring_disabled = 2

# Network: no ICMP redirects or source routes, strict reverse-path filter, SYN cookies, no answers to broadcast pings.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
-net.ipv6.conf.all.accept_redirects = 0
-net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
-net.ipv6.conf.all.accept_source_route = 0
net.ipv4.tcp_syncookies = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1

# ping runs without setuid: every group may open ICMP datagram sockets.
net.ipv4.ping_group_range = 0 2147483647
