# /etc/rc.conf -- FreeLFS system settings, read by the boot scripts.

# Hardware clock: UTC or localtime
HARDWARECLOCK=UTC

# Console keymap and font (see /usr/share/keymaps and /usr/share/consolefonts);
# empty keeps the kernel defaults.
KEYMAP=
CONSOLEFONT=

# Kernel modules to load at boot, in order
MODULES=()

# Services to start, in order (ntp keeps the clock right; Settings > Date & time
# switches it, see /etc/fltime.conf). They stop in reverse order. Each one is a
# script in /etc/rc.d/init.d; prefix a name with ! to disable it.
SERVICES=(syslog dbus network seatd iwd ntp)

# Network (/etc/rc.d/init.d/network). Interfaces to bring up, each with
# "dhcp" or "static ADDRESS/PREFIX GATEWAY".
NETWORK=(
	# "eth0 dhcp"
	# "eth0 static 192.168.1.10/24 192.168.1.1"
)
